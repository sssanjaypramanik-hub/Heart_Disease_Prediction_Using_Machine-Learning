<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AI Heart Disease Prediction</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    background:linear-gradient(-45deg,#1e3c72,#2a5298,#4facfe,#00f2fe);
    background-size:400% 400%;
    animation:bgMove 10s infinite alternate;
    overflow-y:auto;
    overflow-x:hidden;
    padding:40px 20px;
}
.card{
    width:100%;
    max-width:900px;
    margin:30px auto;
}

@keyframes bgMove{
0%{background-position:left;}
100%{background-position:right;}
}

body::before{
content:"";
position:fixed;
width:350px;
height:350px;
background:#00e5ff55;
border-radius:50%;
filter:blur(120px);
left:-120px;
top:-120px;
}

body::after{
content:"";
position:fixed;
width:350px;
height:350px;
background:#ff408155;
border-radius:50%;
filter:blur(120px);
right:-120px;
bottom:-120px;
}

.card{
width:100%;
max-width:900px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(20px);
border-radius:25px;
border:1px solid rgba(255,255,255,.25);
padding:35px;
box-shadow:0 15px 40px rgba(0,0,0,.3);
}

.title{
text-align:center;
color:#fff;
margin-bottom:25px;
}

.title h2{
font-weight:bold;
}

.title i{
color:#ff4d6d;
font-size:35px;
}

.form-label{
color:white;
font-weight:600;
}

.form-control{
height:50px;
border-radius:12px;
background:rgba(255,255,255,.15);
border:1px solid rgba(255,255,255,.25);
color:white;
}

.form-control::placeholder{
color:#ddd;
}

.form-control:focus{
background:rgba(255,255,255,.25);
color:white;
box-shadow:0 0 15px #00f2fe;
border-color:#00f2fe;
}

.predict-btn{
margin-top:20px;
height:55px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#ff416c,#0072ff);
color:white;
font-size:18px;
font-weight:bold;
transition:.4s;
}

.predict-btn:hover{
transform:translateY(-3px);
box-shadow:0 0 20px #00f2fe;
}

/* Particle Background */

#particles{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
overflow:hidden;
z-index:-1;
}

.particle{

position:absolute;

border-radius:50%;

background:rgba(0,229,255,.5);

box-shadow:
0 0 10px cyan,
0 0 25px cyan,
0 0 40px cyan;

animation:float linear infinite;

}

@keyframes float{

0%{

transform:translateY(100vh) scale(.3);

opacity:0;

}

20%{

opacity:1;

}

100%{

transform:translateY(-120vh) scale(1.3);

opacity:0;

}

}
</style>

</head>

<body>
    <div id="particles"></div>

<div class="card">

<div class="title">
<i class="bi bi-heart-pulse-fill"></i>
<h2> Heart Disease Prediction</h2>
<p>Enter Patient Information</p>
</div>

<form action="/process" method="POST">

<div class="row">

<div class="col-md-6 mb-3">
<label class="form-label">Age</label>
<input type="number" class="form-control" name="Age" placeholder="Enter Age" required>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Sex</label>
<input type="number" class="form-control" name="Sex" placeholder="0 = Female | 1 = Male" required>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Chest Pain Type</label>
<input type="number" class="form-control" name="Chest pain type" placeholder="Chest Pain Type" required>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Blood Pressure</label>
<input type="number" class="form-control" name="BP" placeholder="Blood Pressure" required>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Cholesterol</label>
<input type="number" class="form-control" name="Cholesterol" placeholder="Cholesterol" required>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">FBS Over 120</label>
<input type="number" class="form-control" name="FBS over 120" placeholder="0 or 1" required>
</div>
<div class="col-md-6 mb-3">
    <label class="form-label">EKG Results</label>
    <input type="number" class="form-control" name="EKG results" placeholder="EKG Results" required>
</div>

<div class="col-md-6 mb-3">
    <label class="form-label">Maximum Heart Rate</label>
    <input type="number" class="form-control" name="Max HR" placeholder="Maximum HR" required>
</div>

<div class="col-md-6 mb-3">
    <label class="form-label">Exercise Angina</label>
    <input type="number" class="form-control" name="Exercise angina" placeholder="0 = No, 1 = Yes" required>
</div>

<div class="col-md-6 mb-3">
    <label class="form-label">ST Depression</label>
    <input type="number" step="any" class="form-control" name="ST depression" placeholder="ST Depression" required>
</div>

<div class="col-md-6 mb-3">
    <label class="form-label">Slope of ST</label>
    <input type="number" class="form-control" name="Slope of ST" placeholder="Slope of ST" required>
</div>

<div class="col-md-6 mb-3">
    <label class="form-label">Number of Vessels</label>
    <input type="number" class="form-control" name="Number of vessels fluro" placeholder="0 - 3" required>
</div>

<div class="col-md-12 mb-4">
    <label class="form-label">Thallium</label>
    <input type="number" class="form-control" name="Thallium" placeholder="Enter Thallium" required>
</div>

<div class="col-12">
    <button type="submit" class="btn predict-btn w-100">
        <i class="bi bi-cpu-fill"></i> Predict Disease
    </button>
</div>

</div>

</form>

</div>

<script>
const form = document.querySelector("form");

form.addEventListener("submit", function(e){

    const inputs = document.querySelectorAll("input");

    for(let input of inputs){

        if(input.value.trim() === ""){
            alert("Please fill all fields!");
            input.focus();
            e.preventDefault();
            return;
        }

    }

    const btn = document.querySelector(".predict-btn");

    btn.innerHTML =
    '<span class="spinner-border spinner-border-sm"></span> Predicting...';

    btn.disabled = true;

});
</script>
<script>

const particles=document.getElementById("particles");

for(let i=0;i<60;i++){

let p=document.createElement("span");

p.className="particle";

let size=Math.random()*8+3;

p.style.width=size+"px";
p.style.height=size+"px";

p.style.left=Math.random()*100+"%";

p.style.animationDuration=(Math.random()*8+8)+"s";

p.style.animationDelay=Math.random()*5+"s";

particles.appendChild(p);

}

</script>
</body>
</html>
