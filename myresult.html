<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Heart Disease Prediction Result</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(120deg,#020024,#090979,#00d4ff);

    overflow:hidden;
    position:relative;

}


/* Floating Light Balls */

body::before{

    content:"";

    position:absolute;

    width:500px;
    height:500px;

    background:
    radial-gradient(circle,
    #00ffff,
    transparent 70%);

    border-radius:50%;

    top:-150px;
    left:-150px;

    opacity:.5;

    animation:floating1 8s infinite alternate ease-in-out;

}



body::after{

    content:"";

    position:absolute;

    width:450px;
    height:450px;

    background:
    radial-gradient(circle,
    #ff0066,
    transparent 70%);


    border-radius:50%;


    bottom:-150px;
    right:-150px;


    opacity:.5;


    animation:floating2 10s infinite alternate ease-in-out;

}



/* Animation */

@keyframes floating1{

    0%{

        transform:translate(0,0) scale(1);

    }


    100%{

        transform:translate(200px,150px) scale(1.4);

    }

}



@keyframes floating2{

    0%{

        transform:translate(0,0) scale(1);

    }


    100%{

        transform:translate(-200px,-150px) scale(1.3);

    }

}

.result-card{
    position:relative;
    overflow:hidden;

    width:500px;
    padding:45px;

    border-radius:30px;

    background:rgba(255,255,255,.12);

    backdrop-filter:blur(30px);
    -webkit-backdrop-filter:blur(30px);

    border:1px solid rgba(255,255,255,.25);

    box-shadow:
    0 20px 60px rgba(0,0,0,.35),
    inset 0 1px 1px rgba(255,255,255,.45),
    inset 0 -1px 1px rgba(255,255,255,.08);

}

.result-card::before{

content:"";

position:absolute;

top:-60%;

left:-40%;

width:180px;

height:700px;

background:rgba(255,255,255,.28);

transform:rotate(25deg);

filter:blur(12px);

animation:shine 5s linear infinite;

}

@keyframes shine{

0%{
left:-60%;
}

100%{
left:140%;
}

}
.result-card h1{
    text-align:center;
    color:white;
    font-size:32px;
    margin-bottom:25px;
    text-shadow:0 0 15px cyan;
}


.icon{
    display:flex;
    justify-content:center;
    align-items:center;

    width:100px;
    height:100px;

    margin:0 auto 25px;

    font-size:55px;

    color:#ff4d6d;

    border-radius:50%;

    background:rgba(255,255,255,.12);

    border:1px solid rgba(255,255,255,.25);

    box-shadow:
        0 0 20px #ff4d6d,
        0 0 40px rgba(255,77,109,.5),
        inset 0 1px 2px rgba(255,255,255,.3);

    animation:heartbeat 1.2s infinite;
}

@keyframes heartbeat{

    0%{
        transform:scale(1);
    }

    25%{
        transform:scale(1.15);
    }

    40%{
        transform:scale(1);
    }

    60%{
        transform:scale(1.15);
    }

    100%{
        transform:scale(1);
    }

}

.result{
    margin:25px 0;
    padding:20px;

    border-radius:18px;

    background:linear-gradient(
    135deg,
    rgba(0,229,255,.25),
    rgba(255,255,255,.08)
    );

    border:1px solid rgba(255,255,255,.3);

    color:white;

    font-size:26px;
    font-weight:bold;
    text-align:center;

    box-shadow:
    0 0 25px cyan,
    inset 0 1px 2px rgba(255,255,255,.4);
}

.btn-home{
    display:inline-block;

    margin-top:20px;

    padding:14px 35px;

    border-radius:14px;

    text-decoration:none;

    color:white;

    font-size:18px;
    font-weight:bold;

    background:linear-gradient(90deg,#00d2ff,#0072ff);

    box-shadow:
    0 10px 30px rgba(0,180,255,.5);

    transition:.4s;
}

.btn-home:hover{
    transform:translateY(-4px);

    box-shadow:
    0 15px 35px cyan;

    color:white;
}

.footer{

margin-top:18px;

color:#ddd;

font-size:14px;

}

</style>

</head>

<body>

<div class="result-card">

<div class="icon">
<i class="bi bi-heart-pulse-fill"></i>
</div>

<h1>Heart Disease Prediction</h1>

<div class="result">

{{ prediction }}

</div>

<a href="/" class="btn-home">

<i class="bi bi-arrow-left-circle-fill"></i>

Go Back

</a>

<div class="footer">

 Healthcare Prediction System

</div>

</div>

</body>
</html>
